<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STM32MPU Benchmark Reports</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      background-image: radial-gradient(at 50% 0%, #1e1b4b 0%, #0f172a 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
    }

    .header p {
      margin-top: 16px;
      font-size: 1.125rem;
      color: var(--text-muted);
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.25s ease, 
                  box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #475569;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .card p {
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 24px 0;
      font-size: 0.975rem;
    }

    .card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease, transform 0.15s ease;
      width: fit-content;
    }

    .card a::after {
      content: "→";
      transition: transform 0.2s ease;
    }

    .card a:hover {
      background-color: var(--primary-hover);
    }

    .card a:hover::after {
      transform: translateX(4px);
    }

    .footer {
      text-align: center;
      margin-top: 56px;
      font-size: 0.875rem;
      color: var(--text-muted);
      letter-spacing: 0.025em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>STM32MPU Benchmark Reports</h1>
      <p>
        Performance reports for cryptographic operations accelerated by the STM32 Provider.
      </p>
    </div>

    <div class="cards">
      <div class="card">
        <div>
          <h2>Digest Benchmarks</h2>
          <p>
            For digest operations.
          </p>
        </div>
        <a href="digest.html">Open Digest Report</a>
      </div>

      <div class="card">
        <div>
          <h2>Cipher Benchmarks</h2>
          <p>
            For cipher operations.
          </p>
        </div>
        <a href="cipher.html">Open Cipher Report</a>
      </div>
    </div>

    <div class="footer">
      STM32MPU Provider - GitHub Pages
    </div>
  </div>
</body>
</html>
